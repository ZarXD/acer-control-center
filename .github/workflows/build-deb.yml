name: Build & Release .deb

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # releases: write   # uncomment if using newer runner

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
          echo "Building version $VERSION"

      - name: Install Wayland build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build release binary
        run: |
          cd desktop
          cargo clean
          cargo build --release

      - name: Create .deb package
        run: |
          ./build-deb.sh          # produces acer-control-center_*.deb

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Acer Control Center ${{ github.ref_name }}"
          generate_release_notes: true
          files: acer-control-center_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
