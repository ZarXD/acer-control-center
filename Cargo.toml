[package]
name = "acer-control-center"
version = "1.1.2"
edition = "2021"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
zbus = { version = "3", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
